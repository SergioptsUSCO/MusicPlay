spring.application.name=musicplay

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/musicdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1080}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

jwt.secret=${JWT_SECRET:musicplay-secret-key-2026-very-strong-and-long}
jwt.expiration=${JWT_EXPIRATION:3600000}
