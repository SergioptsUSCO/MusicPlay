spring.application.name=musicplay
spring.config.import=optional:file:.env[.properties],optional:file:../../.env[.properties]
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/musicdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1080}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

musicplay.upload-dir=${MUSICPLAY_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:40MB}

jwt.secret=${JWT_SECRET:musicplay-secret-key-2026-very-strong-and-long}
jwt.expiration=${JWT_EXPIRATION:3600000}

musicplay.mail.host=${MUSICPLAY_MAIL_HOST:}
musicplay.mail.port=${MUSICPLAY_MAIL_PORT:587}
musicplay.mail.username=${MUSICPLAY_MAIL_USERNAME:}
musicplay.mail.password=${MUSICPLAY_MAIL_PASSWORD:}
musicplay.mail.from=${MUSICPLAY_MAIL_FROM:${MUSICPLAY_MAIL_USERNAME:}}
musicplay.mail.auth=${MUSICPLAY_MAIL_AUTH:true}
musicplay.mail.starttls=${MUSICPLAY_MAIL_STARTTLS:true}
musicplay.mail.dev-code-fallback=${MUSICPLAY_MAIL_DEV_CODE_FALLBACK:true}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

musicplay.oauth.success-url=${OAUTH_SUCCESS_URL:http://localhost:5500/front-end/page/home.html}
musicplay.oauth.failure-url=${OAUTH_FAILURE_URL:http://localhost:5500/front-end/page/login.html}
