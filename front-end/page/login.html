<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/front-end/styles/login.css">
    <title>Document</title>
</head>
<body>
    <section id="section-header">
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <div class="logo-icon-wrapper">
          <img src="/front-end/assets/logo.svg" alt="Musicplay Icon"/>
        </div>
        <span class="logo-text">Musicplay</span>
      </a>
      <button class="btn-register">Registro</button>
    </div>
  </header>
</section>

<section id="section-login" class="login-section">
  <div class="container login-container">
    <div class="login-header">
      <h1 class="login-title">Conéctate...</h1>
    </div>

    <div class="login-form-card">
      <form id="loginForm" class="login-form" onsubmit="event.preventDefault();">
        <p id="login-error" class="form-error" aria-live="polite"></p>
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-container">
            <input
              type="email"
              id="email"
              placeholder="Ingresa tu correo electrónico..."
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-container">
            <input
              type="password"
              id="password"
              placeholder="Ingresa tu contraseña..."
            />
          </div>
        </div>

        <button type="submit" class="btn-submit">Iniciar Sesión</button>

        <a href="#" class="forgot-password-link">Olvidaste tu contraseña?</a>
      </form>
    </div>

    <div class="divider">
      <span>o</span>
    </div>

    <div class="social-login-actions">
      <button class="btn-social">
        <img src="/front-end/assets/google-logo.svg" alt="Google Logo" width="24" height="24"/>
        <span>Entrar con Google</span>
      </button>
      <button class="btn-social">
        <span>Entrar como invitado</span>
      </button>
    </div>
  </div>
</section>    
</body>
<script src="/front-end/app/login.js"></script>
</html>
