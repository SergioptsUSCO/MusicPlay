<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/register.css">
    <title>Document</title>
</head>
<body>
<header id="section-header" class="site-header">
  <div class="header-container">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="../assets/logo.svg" alt="Musicplay Icon"/>
      </div>
      <span class="logo-text">Musicplay</span>
    </a>
    <button class="btn-login">Iniciar sesión</button>
  </div>
</header>

<main id="section-register" class="register-section">
  <div class="register-container">
    <h1 class="title">Regístrate...</h1>

    <form id="register-form" class="register-form" action="#" method="POST">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            placeholder="Cómo quieres que te llamemos?..."
            required
          />
        </div>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            placeholder="Ingresa tu correo electrónico..."
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña..."
            required
          />
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="terms" required />
        <label for="terms"
          >Está de acuerdo con los<br />Términos y Condiciones de uso.</label
        >
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>
    </form>

    <div class="divider">o</div>

    <button type="button" class="btn-google">
      <img src="../assets/google-logo.svg" alt="Google Logo" width="24" height="24"/>
      <span>Entrar con Google</span>
    </button>
  </div>
</main>

</body>
<script src="../app/register.js"></script>
</html>
