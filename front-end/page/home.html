<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>MusicPlay | Página Principal</title>
    <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="../styles/home.css">
    
    <link
            rel="stylesheet"
            href="../styles/fuentes.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark px-4 py-3">

    <div class="container-fluid">

        <div class="d-flex align-items-center gap-3">

            <button class="btn sidebar-toggle d-lg-none" type="button" onclick="toggleSidebar()" aria-label="Abrir menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M1.5 12.5a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h12a.5.5 0 0 1 0 1h-12a.5.5 0 0 1-.5-.5z"/>
                </svg>
            </button>

            <a href="#" onclick="loadHomeView()"><img src="../assets/logo.svg" alt="MusicPlay Logo" width="40" height="40"></a>

            <button id="search-view-btn" class="btn search-button" type="button" aria-label="Buscar">
                <span aria-hidden="true">&#128269;</span>
                Buscar
            </button>

            <button class="btn inicio-btn" type="button" onclick="loadHomeView()">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-house" viewBox="0 0 16 16">
                <path d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z"/>
                </svg>
            </button>

        </div>

        <div class="d-flex align-items-center gap-3">

            <a id="admin-link" class="btn premium-btn" href="admin.html">
                Admin
            </a>

            <button id="logout-btn" class="btn premium-btn" type="button">
                Cerrar Sesion
            </button>

            <div id="profile-initial" class="profile-circle">
                S
            </div>

        </div>

    </div>

</nav>

<div class="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- MAIN -->

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <aside class="col-lg-2 sidebar">

            <div class="library-header">

                <h5>
                    Tu biblioteca
                </h5>

                <button class="btn create-btn">
                    + Crear
                </button>

            </div>

                <div
                        class="playlist-item"
                        onclick="loadPlaylistView(1)">

                    <img
                            src="https://picsum.photos/61"
                            alt="">

                    <div>

                        <h6>
                            Music
                        </h6>

                        <p>
                            Lista • Sergio
                        </p>

                    </div>

                </div>

                <div
                        class="playlist-item"
                        onclick="loadPlaylistView(2)">

                    <img
                            src="https://picsum.photos/62"
                            alt="">

                    <div>

                        <h6>
                            Mix diario
                        </h6>

                        <p>
                            Lista • Sergio
                        </p>

                    </div>

                </div>

                <div
                        class="playlist-item"
                        onclick="loadAlbumView()">

                    <img
                            src="https://picsum.photos/63"
                            alt="">

                    <div>

                        <h6>
                            Álbum
                        </h6>

                        <p>
                            Maluma
                        </p>

                    </div>

                </div>

        </aside>

        <!-- MAIN CONTENT -->

        <main class="col-lg-10 main-content">

            <div id="content-view"></div>

        </main>

    </div>

</div>

<!-- PLAYER -->

<footer class="player-bar">

    <div class="song-info">

        <img
                id="player-cover"
                src="../assets/logo.svg"
                alt="Portada">

        <div>

            <h6 id="player-title">
                Selecciona una cancion
            </h6>

            <p id="player-artist">
                MusicPlay
            </p>

        </div>

    </div>

    <div class="player-controls">

        <button id="prev-btn" type="button" aria-label="Cancion anterior">
            ⏮
        </button>

        <button class="play-btn" id="play-btn" type="button" aria-label="Reproducir">
            ▶
        </button>

        <button id="next-btn" type="button" aria-label="Siguiente cancion">
            ⏭
        </button>

        <div class="player-progress">
            <span id="current-time">0:00</span>
            <input id="progress-range" type="range" min="0" max="100" value="0">
            <span id="duration-time">0:00</span>
        </div>

    </div>

    <div class="volume-control">

        <input id="volume-range" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">

    </div>

    <audio id="audio-player" preload="metadata"></audio>

</footer>

<script
        type="module"
        src="../app/home.js"></script>

</body>

</html>
